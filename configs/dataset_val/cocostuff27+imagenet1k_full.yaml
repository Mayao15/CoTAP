dataset_seg:
  pytorch_data_dir: './data'
  lmdb_path: ~ #'./data/lmdb'
  tester_path: ~
  prefix: 'cocostuff27_seg'
  dataset_name: "cocostuff27"
  has_labels: False
  num_neighbors: 7
  n_classes: 27
  ignore_classes: []
  crop_type: ~ #"five"
  head: 'linear'
  ft_res: 224
  res: 336
  target_res: 336
  loader_crop_type: "center"
  bg: 0
  include_stuff: True
  seed: 19270817
  extra_clusters: 0
  update_batches: 5
  kmeans_n_iter: 30
  resume: ~
  lr: 5e-3
  ft_batchsize: 256
  batchsize: 16
  num_finetune_sample: 9600

dataset_cls:
  pytorch_data_dir: './data'
  lmdb_path: ~ #'./data/lmdb'
  tester_path: ~
  # Use full ImageNet-1k for KNN/linear probe, so the initial DINO baseline is ~74% KNN.
  # The default `cocostuff27+imagenet1k.yaml` uses `full_data: False` (30 images/class) to keep eval fast,
  # which typically drops KNN to ~60-65%.
  full_data: True
  prefix: 'imagenet1k_cls'
  dataset_name: "imagenet1k"
  has_labels: False
  num_neighbors: 7
  crop_type: ~ #"five"
  ft_res: 224
  res_resize: 256
  res: 224
  loader_crop_type: "center"
  bg: 1
  include_stuff: True
  lr: 1e-3
  batchsize: 64
  ft_batchsize: 256
  # Full ImageNet-1k train set size
  num_finetune_sample: 1280000


