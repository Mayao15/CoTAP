dataset_cls:
  pytorch_data_dir: './data'
  lmdb_path: ~ #'./data/lmdb'
  tester_path: './tester/save/imagenet1k_cls'
  full_data: True
  # full_data: False
  prefix: 'imagenet1k_cls'
  dataset_name: "imagenet1k"
  has_labels: False
  num_neighbors: 7
  crop_type: ~ #"five"
  ft_res: 224
  res_resize: 256
  res: 224
  loader_crop_type: "center"
  bg: 1
  include_stuff: True
  lr: 1e-3
  batchsize: 64
  ft_batchsize: 256
  num_finetune_sample: 1280000
  # num_finetune_sample: 30000
